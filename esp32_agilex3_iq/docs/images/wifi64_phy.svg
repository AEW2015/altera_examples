<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<title id="title">Native Wi-Fi and custom IQ boundaries</title><desc id="desc">Packet bytes enter the native ESP32 PHY. Raw RF reception and decoding happen in RFS2 and Agilex 3. Arbitrary FPGA IQ injection into the original ESP32 transmitter is not proven.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#70e5d4"/></marker></defs>
