<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberEther · IQ Pipeline Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b121e;color:#e7f0ff;font:15px system-ui}header{display:flex;align-items:center;gap:24px;padding:12px 22px;border-bottom:1px solid #29425b}h1{font-size:19px;margin:0}header small{color:#99afc9}.tabs{display:flex;gap:7px;padding:10px 22px 5px}.tabs button{border-radius:8px 8px 0 0;padding:11px 24px}.tabs button[aria-selected=true]{background:#174c57;color:#7dfff3;border-color:#52dfdd}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:7px 22px 10px}button,select,input{font:inherit;color:inherit;background:#172a40;border:1px solid #3b5876;border-radius:6px;padding:7px 12px;cursor:pointer}button:disabled{opacity:.4;cursor:wait}button:hover{border-color:#52dfdd}label{display:flex;gap:7px;align-items:center}#status{margin-left:auto;color:#75dfa4}#notice{color:#ffc56a;padding:0 22px 8px;min-height:25px}.viewer{height:calc(100vh - 310px);min-height:480px;width:100%;border:0;background:#090d17}#native-link{color:#52dfdd}#exports{font-size:12px;color:#99afc9;max-width:98vw;overflow-wrap:anywhere;padding:0 22px 5px}details{display:inline-block}#fallback{display:none}#fallback img{width:100%} @media(max-width:900px){header small{display:none}.tabs button{padding:9px 12px}.toolbar{gap:6px}.viewer{height:65vh}}
</style>
<header><h1>CyberEther · IQ Pipeline Lab</h1><small>ESP32 RF → Agilex 3 FPGA → measured IQ</small><a id="native-link" target="_blank" rel="noopener">Native viewer ↗</a></header>
<nav class="tabs" role="tablist" aria-label="Design lessons">
<button id="tab-raw" role="tab" data-view="raw">1 · Raw IQ Bridge</button><button id="tab-boxcar" role="tab" data-view="boxcar">2 · Boxcar FIR</button><button id="tab-hamming" role="tab" data-view="hamming">3 · Hamming FIR</button><button id="tab-ddc" role="tab" data-view="ddc">4 · Tune / Filter / Decimate</button><button id="tab-compare" role="tab" data-view="compare">5 · Compare Designs</button>
</nav>
<section class="toolbar">
<label>Radio <select id="source"><option value="0">RFS2 ESP32</option><option value="1">PMOD A ESP32</option><option value="2">PMOD B ESP32</option></select></label>
<label>Wi-Fi channel <select id="channel"></select></label>
<label>Rate <select id="rate"><option value="16000000">16 MS/s</option><option value="40000000">40 MS/s</option><option value="80000000">80 MS/s</option></select></label>
<label>Samples <select id="samples"><option>4096</option><option>8192</option><option>16380</option></select></label>
<label>ESP32 gain <select id="gain-mode"><option value="HARDWARE">Hardware AGC</option><option value="MANUAL">Manual code</option></select></label>
<label>Code <input id="gain-code" type="number" min="0" max="81" step="1" value="40" style="width:80px"></label><button id="apply-gain">Apply gain</button>
<label>FPGA quantization <select id="round"><option value="true">Round nearest</option><option value="false">Truncate</option></select></label>
<button id="run">Pause</button><button id="once">Capture once</button><button id="export">Save IQ pair</button><span id="status">Connecting…</span>
</section><section id="ddc-controls" class="toolbar" style="display:none">
<label>Input <select id="ddc-input"><option value="live">Live ESP32 bursts</option><option value="frozen">Frozen ESP32 snapshot</option><option value="two-tone">FPGA clean two-tone</option><option value="single-tone">FPGA clean single-tone</option><option value="impulse">FPGA clean impulse</option></select></label>
<button id="freeze-input">Freeze current</button><button id="new-snapshot">New snapshot</button><button id="pin-reference">Pin comparison</button><button id="clear-reference">Clear comparison</button><a href="/samples/clean-ddc.zip" style="color:#52dfdd">Download clean IQ</a>
<label>FPGA tune (Hz) <input id="tuning-hz" type="number" value="500000" step="100000" style="width:120px"></label>
<label>Decimate <select id="decimation"><option>1</option><option>2</option><option selected>4</option></select></label>
<label>Stages <select id="ddc-bypass"><option value="0">Mixer + filter</option><option value="1">Filter only</option><option value="2">Mixer only (alias demo)</option><option value="3">Both bypassed</option></select></label><button id="apply-ddc">Apply DDC</button><button id="alias-preset">Show alias</button><button id="filter-preset">Reject interferer</button><label>FPGA digital gain <select id="digital-gain"><option value="bypass">Bypass</option><option value="0">0×</option><option value="128">0.5×</option><option value="256">1×</option><option value="512">2×</option><option value="1024">4×</option><option value="2048">8×</option><option value="4096">16×</option></select></label><small id="input-note">Frozen-burst processing · CI16 readback over JTAG</small>
</section><div id="applied" style="padding:0 22px 8px;color:#99afc9"></div><div id="notice">Tabs 1–3 configure real acquisition. Compare Designs shows history without changing the FPGA image.</div><div id="exports"></div>
<iframe id="viewer" class="viewer" title="Native CyberEther IQ lesson" allow="autoplay; fullscreen"></iframe>
<script>
const token=location.hash.slice(1)||sessionStorage.getItem('iq-lab-token')||'';
if(token)sessionStorage.setItem('iq-lab-token',token);
const el=id=>document.getElementById(id);let state=null,viewerUrl='',ddcDirty=false;
for(let n=1;n<=11;n++)el('channel').add(new Option(`${n} · ${2407+5*n} MHz`,n));
async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'X-Lab-Token':token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d;}
function show(s){state=s;const c=s.settings;el('digital-gain').disabled=!s.fpga.fpga_gain_meter;el('digital-gain').value=c.digital_gain_bypass?'bypass':String(c.digital_gain_q8??256);c.ddc_input??='live';const synthetic=['two-tone','single-tone','impulse'].includes(c.ddc_input);el('ddc-input').value=c.ddc_input||'live';for(const opt of el('ddc-input').options)if(['two-tone','single-tone','impulse'].includes(opt.value))opt.disabled=!s.fpga.fpga_replay_patterns;el('pin-reference').disabled=!s.latest.ddc;el('clear-reference').disabled=!s.reference;el('freeze-input').disabled=c.ddc_input!=='live'||!s.latest.ddc;el('input-note').textContent=synthetic?'SYNTHETIC · FPGA-generated 4096 samples @ 16 MS/s; radio inactive':c.ddc_input==='frozen'?'Same FPGA snapshot reused; New snapshot acquires fresh RF':'Each result acquires fresh RF';for(const id of ['source','channel','rate','samples','gain-mode','apply-gain'])el(id).disabled=c.view==='ddc'&&c.ddc_input!=='live';el('tab-ddc').disabled=!s.fpga.fpga_ddc;el('ddc-controls').style.display=c.view==='ddc'?'flex':'none';for(const [id,key]of [['tuning-hz','tuning_hz'],['decimation','decimation'],['ddc-bypass','ddc_bypass']])if(!ddcDirty&&document.activeElement!==el(id))el(id).value=c[key];document.querySelectorAll('[data-view]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.view===c.view));b.tabIndex=b.dataset.view===c.view?0:-1;});for(const k of ['rate','samples'])el(k).value=synthetic&&c.view==='ddc'?(k==='samples'?4096:16000000):c[k];el('gain-mode').value=c.gain_mode;if(document.activeElement!==el('gain-code'))el('gain-code').value=c.gain_code;el('gain-code').disabled=c.gain_mode==='HARDWARE'||(c.view==='ddc'&&c.ddc_input!=='live');el('source').value=c.source;el('channel').value=c.channel;el('round').value=String(c.round);el('round').disabled=!['boxcar','hamming'].includes(c.view);el('run').textContent=c.continuous?'Pause':'Run';el('once').disabled=c.continuous;el('once').textContent=c.view==='ddc'&&c.ddc_input!=='live'?'Rerun snapshot':'Capture once';el('export').textContent=(c.view==='raw'||(c.view==='compare'&&s.acquiring==='raw'))?'Save raw IQ':'Save IQ pair';el('status').textContent=`${s.status} · ${s.completed} results · ${s.radio_acquisitions||0} new RF inputs`;
 const last=s.latest[s.last_mode];el('applied').textContent=last?`Last applied · ${last.source_name} · ${last.raw.source===3?'Synthetic FPGA input; no RF acquisition':last.receiver_gain?.mode==='HARDWARE'?'Hardware AGC verified':last.receiver_gain?.readback_verified?'Manual code '+last.receiver_gain.manual_code+' verified':'gain unavailable'} · ${last.raw.rate/1e6} MS/s nominal · ${last.raw.samples} samples · ${last.raw.source===3?'CI8 rail hits':'ADC rails'} ${last.adc_rail_percent?.toFixed(2)}% · ${last.ddc?'DDC mixer/filter/gain clips '+last.ddc.mixer_clips+'/'+last.ddc.filter_clips+'/'+(last.ddc.gain_meters?.gain_clips??0):'FIR output clips '+(last.clips??'bypassed')}`:'Waiting for applied acquisition readback';
 el('notice').textContent=s.error||((s.status==='CONFIGURING'||s.status==='ACQUIRING')?`Applying / capturing ${s.acquiring} · new settings take effect between captures`:'Lesson tabs configure real acquisition. DDC processes a frozen burst on the FPGA; Compare shows historical fits.');el('exports').textContent=s.exports.length?'Saved: '+s.exports.at(-1):'';}
async function update(body){try{await api('control',body);show(await api('state'));}catch(e){el('notice').textContent=e.message;}}
document.querySelectorAll('[data-view]').forEach(b=>{b.setAttribute('aria-controls','viewer');b.onclick=()=>update({view:b.dataset.view});b.onkeydown=e=>{const tabs=[...document.querySelectorAll('[data-view]')];let i=tabs.indexOf(b);if(e.key==='ArrowRight')i=(i+1)%tabs.length;else if(e.key==='ArrowLeft')i=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')i=0;else if(e.key==='End')i=tabs.length-1;else return;e.preventDefault();tabs[i].focus();tabs[i].click();};});
for(const id of ['tuning-hz','decimation','ddc-bypass'])el(id).oninput=()=>ddcDirty=true;el('apply-ddc').onclick=async()=>{await update({tuning_hz:Number(el('tuning-hz').value),decimation:Number(el('decimation').value),ddc_bypass:Number(el('ddc-bypass').value),once:!state.settings.continuous});ddcDirty=false;};
el('ddc-input').onchange=e=>{const input=e.target.value,synthetic=['two-tone','single-tone','impulse'].includes(input);update({ddc_input:input,continuous:false,once:true,...(synthetic?{rate:16000000,tuning_hz:input==='impulse'?0:500000,decimation:input==='two-tone'?4:1,ddc_bypass:input==='impulse'?1:2}:{})});};
el('digital-gain').onchange=e=>update({digital_gain_bypass:e.target.value==='bypass',digital_gain_q8:e.target.value==='bypass'?256:Number(e.target.value),once:true});
el('freeze-input').onclick=()=>update({ddc_input:'frozen',continuous:false,once:true});el('new-snapshot').onclick=()=>update({new_snapshot:true});el('pin-reference').onclick=()=>update({reference:'pin'});el('clear-reference').onclick=()=>update({reference:'clear'});
el('alias-preset').onclick=()=>update({tuning_hz:500000,decimation:4,ddc_bypass:2,once:true});el('filter-preset').onclick=()=>update({tuning_hz:500000,decimation:4,ddc_bypass:0,once:true});
for(const k of ['rate','samples'])el(k).onchange=e=>update({[k]:Number(e.target.value)});el('gain-mode').onchange=e=>update({gain_mode:e.target.value});el('apply-gain').onclick=()=>update({gain_mode:el('gain-mode').value,gain_code:Number(el('gain-code').value)});
el('source').onchange=e=>update({source:Number(e.target.value)});el('channel').onchange=e=>update({channel:Number(e.target.value)});el('round').onchange=e=>update({round:e.target.value==='true'});el('run').onclick=()=>state&&update({continuous:!state.settings.continuous});el('once').onclick=()=>update({once:true});el('export').onclick=()=>update({export:true});

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function hasLessonVideo(video){try{const c=document.createElement('canvas');c.width=160;c.height=90;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(video,0,0,160,90);const p=x.getImageData(0,0,160,90).data;let blue=0;for(let i=0;i<p.length;i+=4)if(p[i+2]>25&&p[i+2]>p[i]*1.25&&p[i+2]>p[i+1]*1.1)blue++;return blue/(160*90)>.3;}catch{return false;}}
async function openLessonStack(){const iframe=el('viewer');iframe.dataset.lessonReady='false';for(let tries=0;tries<80;tries++){let video;try{video=iframe.contentDocument?.querySelector('video');}catch{}if(video?.videoWidth&&video.readyState>=2){await sleep(500);for(const nativeX of [390,420,450,420]){if(hasLessonVideo(video)){iframe.dataset.lessonReady='true';return;}const rect=video.getBoundingClientRect(),scale=Math.min(rect.width/video.videoWidth,rect.height/video.videoHeight);const x=rect.left+(rect.width-video.videoWidth*scale)/2+nativeX*scale,y=rect.top+(rect.height-video.videoHeight*scale)/2+42*scale;video.focus();const fire=(type,buttons)=>video.dispatchEvent(new iframe.contentWindow.MouseEvent(type,{bubbles:true,clientX:x,clientY:y,button:0,buttons}));fire('mousemove',0);fire('mousedown',1);await sleep(180);fire('mouseup',0);fire('click',0);await sleep(650);}if(hasLessonVideo(video)){iframe.dataset.lessonReady='true';return;}}await sleep(400);}el('notice').textContent='Native viewer: select the IQ Pipeline Lab tab above its canvas.';}
el('viewer').addEventListener('load',openLessonStack);

async function poll(){try{show(await api('state'));{const v=await api('viewer');if(v.remote_viewer_url&&v.remote_viewer_url!==viewerUrl){viewerUrl=v.remote_viewer_url;const u=new URL(viewerUrl);const broker=`ws://${u.host}/api/v1/remote/signaller`;el('viewer').src='/native?signaller='+encodeURIComponent(broker)+u.hash;el('native-link').href=viewerUrl;}}}catch(e){el('status').textContent='DISCONNECTED';el('notice').textContent=token?e.message:'Open the private control-invite.json URL to enable controls.';}setTimeout(poll,1000);}poll();
</script></html>
