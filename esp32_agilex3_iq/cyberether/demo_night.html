<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RF Arcade · ESP32 × Agilex 3 × CyberEther</title>
<style>
:root{color-scheme:dark;--cyan:#52f4ed;--pink:#ff598d;--gold:#ffd16b;--muted:#94a9c4}*{box-sizing:border-box}[hidden]{display:none!important}body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;margin:0;background:#070c19;color:#edf6ff;font:15px system-ui}header{flex-shrink:0;display:flex;align-items:center;gap:24px;padding:12px 24px;background:linear-gradient(110deg,#112335,#150e29);border-bottom:1px solid #22354f}h1{font-size:27px;margin:0;letter-spacing:4px;color:var(--cyan)}.brand small{color:var(--muted);font-size:11px;letter-spacing:2px}.acts{display:flex;gap:7px;margin:auto}button,select{font:inherit;color:inherit;border:1px solid #304764;background:#101d32;border-radius:9px;padding:10px 15px;cursor:pointer;transition:.2s}button:hover{border-color:var(--cyan);box-shadow:0 0 20px #52f4ed22}button.active{background:#153638;border-color:var(--cyan);color:var(--cyan);box-shadow:inset 0 -2px var(--cyan)}button:disabled{opacity:.4}#auto{border-color:var(--pink);color:var(--pink)}#auto.active{color:white;background:#87344e;box-shadow:0 0 20px #ff598d44}nav{flex-shrink:0;display:flex;gap:8px;align-items:center;padding:9px 24px;background:#0b1424;min-height:51px}#choices{display:flex;gap:8px}.badge{font:12px ui-monospace,monospace;color:var(--gold);letter-spacing:1px;margin-left:auto}#progress{flex-shrink:0;height:3px;background:#182940}#progress div{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .5s linear;box-shadow:0 0 12px var(--cyan)}#notice{position:absolute;z-index:2;bottom:14px;left:28px;background:#091425e8;padding:5px 12px;border-radius:5px;color:var(--muted);font-size:12px}#notice:empty{display:none}iframe{border:0;width:100%;flex:1;min-height:0;height:auto;display:block}#native-link{color:var(--muted);font-size:13px;white-space:nowrap}body.clean header .brand small{display:none}@media(max-width:1000px){header{gap:10px;flex-wrap:wrap}.acts{margin:0}button{padding:8px}nav{flex-wrap:wrap}iframe{min-height:0}}
</style></head><body>
<header><div class="brand"><h1>RF / ARCADE</h1><small>ESP32 × AGILEX 3 FPGA × CYBERETHER</small></div><div class="acts"><button data-scene="airwaves" data-family="rf">01 / Airwaves</button><button data-scene="fold" data-family="rescue">02 / Rescue the tone</button><button data-scene="clean" data-family="power">03 / Power rush</button></div><button id="auto">▶ Showreel</button><button id="fullscreen" title="Fullscreen">⛶</button><a id="native-link" target="_blank">CyberEther ↗</a></header>
<nav><div id="choices"></div><select id="source" aria-label="ESP32 radio"><option value="0">RFS2 ESP32</option><option value="1">PMOD A ESP32</option><option value="2">PMOD B ESP32</option></select><select id="channel" aria-label="Wi-Fi channel"></select><button id="pause">Freeze</button><span class="badge" id="status">CONNECTING TO HARDWARE</span></nav>
<div id="progress"><div></div></div><div id="notice"></div><iframe id="viewer" allow="autoplay; fullscreen"></iframe>
<script>
const token=location.hash.slice(1),el=id=>document.getElementById(id);let state=null,viewerUrl='',family=null;
async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'X-Lab-Token':token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
async function show(body){try{await api('show',body);await poll(false)}catch(e){el('notice').textContent=e.message}}
for(let n=1;n<=11;n++)el('channel').add(new Option('Channel '+n,n));
document.querySelectorAll('[data-family]').forEach(b=>b.onclick=()=>show({scene:b.dataset.scene}));
el('auto').onclick=()=>state&&show({auto:!state.demo_night.auto});el('source').onchange=e=>show({scene:'airwaves',source:Number(e.target.value)});el('channel').onchange=e=>show({scene:'airwaves',channel:Number(e.target.value)});
el('pause').onclick=async()=>{if(state){await api('control',{continuous:!state.settings.continuous});await poll(false)}};
el('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
const labels={airwaves:'Live RF + FIR',fold:'① Fold',tune:'② Shift to DC',reject:'③ Reject interferer',clean:'1× / Clean',boost:'2× / +6 dB',overdrive:'16× / Clip'};
async function poll(schedule=true){try{const s=await api('state');state=s;const d=s.demo_night;if(!d)throw Error('Start scripts/demo_night.py for this view');if(family!==d.family){family=d.family;el('choices').replaceChildren();d.scenes.filter(v=>v.family===family).forEach(v=>{const b=document.createElement('button');b.textContent=labels[v.id];b.dataset.choice=v.id;b.onclick=()=>show({scene:v.id});el('choices').append(b)})}document.querySelectorAll('[data-choice]').forEach(b=>b.classList.toggle('active',b.dataset.choice===d.scene));document.querySelectorAll('[data-family]').forEach(b=>b.classList.toggle('active',b.dataset.family===d.family));el('source').hidden=el('channel').hidden=family!=='rf';el('source').value=String(s.settings.source);el('channel').value=String(s.settings.channel);el('auto').classList.toggle('active',d.auto);el('auto').textContent=d.auto?'■ Stop showreel':'▶ Showreel';el('pause').textContent=s.settings.continuous?'Freeze':'Resume';el('status').textContent=(d.waiting?'APPLYING FPGA SETTINGS':s.status)+' / '+s.completed+' VERIFIED';el('progress').firstElementChild.style.width=(d.auto?Math.min(100,100*d.elapsed/d.duration):0)+'%';el('notice').textContent=s.error||'';const v=await api('viewer');if(v.remote_viewer_url&&viewerUrl!==v.remote_viewer_url){viewerUrl=v.remote_viewer_url;const u=new URL(viewerUrl);el('viewer').src='/native?signaller='+encodeURIComponent('ws://'+u.host+'/api/v1/remote/signaller')+u.hash;el('native-link').href=viewerUrl}}catch(e){el('notice').textContent=e.message}if(schedule)setTimeout(poll,650)}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function hasLessonVideo(video){try{const c=document.createElement('canvas');c.width=160;c.height=90;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(video,0,0,160,90);const p=x.getImageData(0,0,160,90).data;let blue=0;for(let i=0;i<p.length;i+=4)if(p[i+2]>25&&p[i+2]>p[i]*1.25&&p[i+2]>p[i+1]*1.1)blue++;return blue/(160*90)>.3;}catch{return false;}}
function themeNative(doc,video){doc.documentElement.style.backgroundColor='#070c19';doc.body.style.backgroundColor='#070c19';const paintParents=node=>{while(node&&node!==doc.documentElement){node.style.setProperty('background-color','#070c19','important');node=node.parentElement}};paintParents(video.parentElement);doc.querySelectorAll('button').forEach(b=>{paintParents(b.parentElement);b.style.backgroundColor='#101d32';b.style.color='#94a9c4'})}
async function openLessonStack(){const iframe=el('viewer');iframe.dataset.lessonReady='false';for(let tries=0;tries<80;tries++){let video;try{video=iframe.contentDocument?.querySelector('video');}catch{}if(video?.videoWidth&&video.readyState>=2){themeNative(iframe.contentDocument,video);await sleep(500);for(const nativeX of [260,300,340,390]){if(hasLessonVideo(video)){iframe.dataset.lessonReady='true';return;}const rect=video.getBoundingClientRect(),scale=Math.min(rect.width/video.videoWidth,rect.height/video.videoHeight);const x=rect.left+(rect.width-video.videoWidth*scale)/2+nativeX*scale,y=rect.top+(rect.height-video.videoHeight*scale)/2+42*scale;video.focus();const fire=(type,buttons)=>video.dispatchEvent(new iframe.contentWindow.MouseEvent(type,{bubbles:true,clientX:x,clientY:y,button:0,buttons}));fire('mousemove',0);fire('mousedown',1);await sleep(180);fire('mouseup',0);fire('click',0);await sleep(650);}if(hasLessonVideo(video)){iframe.dataset.lessonReady='true';return;}}await sleep(400);}el('notice').textContent='Native viewer: select the RF Arcade tab above its canvas.';}
el('viewer').addEventListener('load',openLessonStack);

poll();
</script></body></html>
