<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agilex 3 · Focused IQ Lesson</title>
<style>[hidden]{display:none!important}body{margin:0;background:#0b121e;color:#e7f0ff;font:16px system-ui}header{padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:21px;margin:0}button,select{font:inherit;padding:8px;background:#172a40;color:inherit;border:1px solid #52dfdd;border-radius:5px}button:disabled{opacity:.45}a{color:#52dfdd}#notice{padding:0 20px 10px;color:#ffc56a}iframe{width:100%;height:calc(100vh - 130px);min-height:600px;border:0}#status{margin-left:auto}label{display:flex;gap:10px;align-items:center}</style>
<header><h1 id="title">Connecting…</h1><label id="choice-label" hidden><span id="choice-title"></span><select id="choice"></select></label><button id="run">Pause</button><button id="once">Capture once</button><span id="status"></span><a id="native-link" target="_blank">Native viewer ↗</a></header>
<div id="notice">Reading the current FPGA checkpoint…</div><iframe id="viewer" allow="autoplay; fullscreen"></iframe>
<script>
const token=location.hash.slice(1),el=id=>document.getElementById(id);let state=null,viewerUrl='',lesson=0;
async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'X-Lab-Token':token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d;}
async function update(v){try{await api('control',v)}catch(e){el('notice').textContent=e.message}}
const names=['','1 · Raw IQ Bridge','2 · Nios V Transfer Monitor','3 · FIR II Filter','4 · Frequency Translation / Decimation','5 · Gain / Power Meters'];
function init(s){lesson=Number(s.fpga.stage_relative.match(/demo_0(\d)/)[1]);document.title=names[lesson]+' · CyberEther';el('title').textContent=names[lesson];let choices=[];
if(lesson===3){el('choice-title').textContent='Filter';choices=[['hamming','Hamming · rejection'],['boxcar','Boxcar · smoothing']]}
if(lesson===4){el('choice-title').textContent='Experiment';choices=[['reject','Shift + filter + decimate'],['alias','Shift + decimate · no filter'],['zero','No shift · filtered']]}
if(lesson===5){el('choice-title').textContent='FPGA gain';choices=[['128','0.5×'],['256','1×'],['512','2×'],['1024','4×'],['4096','16× · clipping']]}
choices.forEach(([v,t])=>el('choice').add(new Option(t,v)));el('choice-label').hidden=!choices.length;
el('choice').value=lesson===3?s.settings.view:lesson===5?String(s.settings.digital_gain_q8):'reject';
el('choice').onchange=e=>update(lesson===3?{view:e.target.value}:lesson===4?{tuning_hz:e.target.value==='zero'?0:500000,ddc_bypass:e.target.value==='alias'?2:0}:{digital_gain_q8:Number(e.target.value),digital_gain_bypass:false});}
el('run').onclick=()=>state&&update({continuous:!state.settings.continuous});el('once').onclick=()=>update({once:true});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function hasLessonVideo(video){try{const c=document.createElement('canvas');c.width=160;c.height=90;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(video,0,0,160,90);const p=x.getImageData(0,0,160,90).data;let blue=0;for(let i=0;i<p.length;i+=4)if(p[i+2]>25&&p[i+2]>p[i]*1.25&&p[i+2]>p[i+1]*1.1)blue++;return blue/(160*90)>.3;}catch{return false;}}
async function openLessonStack(){const iframe=el('viewer');iframe.dataset.lessonReady='false';for(let tries=0;tries<80;tries++){let video;try{video=iframe.contentDocument?.querySelector('video');}catch{}if(video?.videoWidth&&video.readyState>=2){await sleep(500);for(const nativeX of [390,420,450,420]){if(hasLessonVideo(video)){iframe.dataset.lessonReady='true';return;}const rect=video.getBoundingClientRect(),scale=Math.min(rect.width/video.videoWidth,rect.height/video.videoHeight);const x=rect.left+(rect.width-video.videoWidth*scale)/2+nativeX*scale,y=rect.top+(rect.height-video.videoHeight*scale)/2+42*scale;video.focus();const fire=(type,buttons)=>video.dispatchEvent(new iframe.contentWindow.MouseEvent(type,{bubbles:true,clientX:x,clientY:y,button:0,buttons}));fire('mousemove',0);fire('mousedown',1);await sleep(180);fire('mouseup',0);fire('click',0);await sleep(650);}if(hasLessonVideo(video)){iframe.dataset.lessonReady='true';return;}}await sleep(400);}el('notice').textContent='Native viewer: select the IQ Pipeline Lab tab above its canvas.';}
el('viewer').addEventListener('load',openLessonStack);

async function poll(){try{const s=await api('state');if(!lesson)init(s);state=s;el('status').textContent=`${s.status} · ${s.completed} results`;el('run').textContent=s.settings.continuous?'Pause':'Run';el('once').disabled=s.settings.continuous;el('notice').textContent=s.error||(lesson===2?'Live RF transfers → FPGA counters → Nios V / JTAG UART':lesson<=3?'Live RF → actual checkpoint '+lesson+' FPGA image · host display FFT':lesson===4?'FPGA-generated two-tone → FPGA DDC · no RF transmission':'FPGA-generated single-tone → FPGA gain and integer meters · no RF transmission');const v=await api('viewer');if(v.remote_viewer_url&&viewerUrl!==v.remote_viewer_url){viewerUrl=v.remote_viewer_url;const u=new URL(viewerUrl);el('viewer').src='/native?signaller='+encodeURIComponent('ws://'+u.host+'/api/v1/remote/signaller')+u.hash;el('native-link').href=viewerUrl}}catch(e){el('notice').textContent=e.message}setTimeout(poll,1000)}poll();
</script>
